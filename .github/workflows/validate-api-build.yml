name: Validate API build

on:
  push:
    branches:
      - fix/guatemala-utc-time

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 5 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 5.0.x

      - name: Restore
        run: dotnet restore InvernaderoIoT.API/InvernaderoIoT.API.csproj

      - name: Build
        run: dotnet build InvernaderoIoT.API/InvernaderoIoT.API.csproj --configuration Release --no-restore
